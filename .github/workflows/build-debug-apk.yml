name: Compilar APK de depuración
on:
  workflow_dispatch:
    inputs:
      publishable_key:
        description: Clave publicable del proyecto Supabase de pruebas
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Preparar configuración del proyecto de pruebas
        env:
          SUPABASE_TEST_PUBLISHABLE_KEY: ${{ inputs.publishable_key }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          key = os.environ['SUPABASE_TEST_PUBLISHABLE_KEY'].strip()
          if not key.startswith('sb_publishable_'):
              raise SystemExit('Se requiere una clave publicable de Supabase.')
          Path('supabase/config.test.local.json').write_text(json.dumps({
              'SUPABASE_URL': 'https://wtrelwtztkddfktrfdpb.supabase.co',
              'SUPABASE_PUBLISHABLE_KEY': key,
              'SUPABASE_EXISTING_SCHEMA': True,
              'SUPABASE_GOOGLE_ENABLED': False,
          }))
          PY
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --timeout 5m
      - name: Generar APK instalable de depuración
        run: flutter build apk --debug --flavor beta --target-platform android-arm64 --dart-define=APP_CHANNEL=beta --dart-define-from-file=supabase/config.test.local.json
      - uses: actions/upload-artifact@v4
        with:
          name: vetdosis-pruebas-debug-arm64
          path: build/app/outputs/flutter-apk/app-beta-debug.apk
          if-no-files-found: error
          retention-days: 14

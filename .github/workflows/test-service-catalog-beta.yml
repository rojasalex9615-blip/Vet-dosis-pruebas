name: Validar catálogo de servicios en beta
on:
  pull_request:
    paths:
      - 'lib/modules/operations/**'
      - 'supabase/proposed/13B[1-5]_*'
      - 'supabase/tests/permission_clinic_operations.sql'
      - 'supabase/tests/service_commission_settlements.sql'
      - 'supabase/tests/run_permission_clinic_operations.sh'
      - 'test/service_catalog_beta_test.dart'
      - '.github/workflows/test-service-catalog-beta.yml'
  push:
    paths:
      - 'lib/modules/operations/**'
      - 'supabase/proposed/13B[1-5]_*'
      - 'supabase/tests/permission_clinic_operations.sql'
      - 'supabase/tests/service_commission_settlements.sql'
      - 'supabase/tests/run_permission_clinic_operations.sh'
      - 'test/service_catalog_beta_test.dart'
      - '.github/workflows/test-service-catalog-beta.yml'
permissions:
  contents: read
jobs:
  service-flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/service_catalog_beta_test.dart
  service-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash supabase/tests/run_permission_clinic_operations.sh

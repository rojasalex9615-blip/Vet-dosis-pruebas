name: Restaurar archivos Storage cifrados (aislado)
on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: Ejecución que creó el respaldo cifrado de Storage
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  isolated-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vetdosis-encrypted-storage-backup
          run-id: ${{ inputs.backup_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/encrypted-storage
      - name: Recuperar y comprobar cada archivo sin conexión al proyecto
        env:
          SUPABASE_TEST_BACKUP_PASSPHRASE: ${{ secrets.SUPABASE_TEST_BACKUP_PASSPHRASE }}
        run: python3 scripts/supabase/verify_storage_backup.py --artifact-dir "$RUNNER_TEMP/encrypted-storage"
      - name: Limpiar archivo temporal
        if: always()
        run: rm -rf "$RUNNER_TEMP/encrypted-storage"

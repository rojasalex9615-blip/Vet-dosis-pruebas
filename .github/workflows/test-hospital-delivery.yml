name: Comprobar avisos hospitalarios externos
on:
  push:
    paths:
      - 'supabase/proposed/14J_hospital_external_delivery.sql'
      - 'supabase/functions/hospital-delivery/**'
      - 'supabase/functions/_shared/hospital_delivery.mjs'
      - 'supabase/tests/hospital_delivery*'
      - 'supabase/tests/run_hospital_automation.sh'
      - '.github/workflows/test-hospital-delivery.yml'
  pull_request:
    paths:
      - 'supabase/proposed/14J_hospital_external_delivery.sql'
      - 'supabase/functions/hospital-delivery/**'
      - 'supabase/functions/_shared/hospital_delivery.mjs'
      - 'supabase/tests/hospital_delivery*'
      - 'supabase/tests/run_hospital_automation.sh'
      - '.github/workflows/test-hospital-delivery.yml'
permissions:
  contents: read
jobs:
  local-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test supabase/tests/hospital_delivery.test.mjs
      - run: HOSPITAL_TEST_DELIVERY=1 bash supabase/tests/run_hospital_automation.sh
